# Dark, professional theme with an EY-inspired accent: charcoal surfaces +
# signature yellow (#FFE600) used sparingly for highlights and primary actions.
[theme]
base = "dark"
primaryColor = "#FFE600"
backgroundColor = "#17171E"
secondaryBackgroundColor = "#23232C"
textColor = "#F2F2F5"
font = "sans serif"

[server]
maxUploadSize = 500   # MB — audit ZIPs can be large
# Faster startup: skips watching source files (which also scans the huge
# transformers package). Set back to "auto" while actively developing.
fileWatcherType = "none"
